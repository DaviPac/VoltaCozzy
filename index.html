<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volta cozzi!</title>
  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 20px;
      font-family: sans-serif;
      z-index: 2;
    }

    #gameOverScreen {
      display: none;
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      top: 0;
      left: 0;
      justify-content: center;
      align-items: center;
      z-index: 3;
    }

    #gameOverScreen img {
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

<div id="score">Pontos: 1</div>
<canvas id="gameCanvas" width="640" height="360"></canvas>

<div id="gameOverScreen">
  <img src="ima/gameover.png" alt="Game Over" />
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const bgImg = new Image();
  bgImg.src = 'ima/rural.png';

  const playerImg = new Image();
  playerImg.src = 'ima/hely.png';

  const balaImg = new Image();
  balaImg.src = 'ima/bala.png';

  const cuscuzImg = new Image();
  cuscuzImg.src = 'ima/cuscuz.png';

  const gameOverScreen = document.getElementById('gameOverScreen');
  const scoreDiv = document.getElementById('score');

  const WIDTH = canvas.width;
  const HEIGHT = canvas.height;

  let pontos = 1;
  let gameOver = false;

  const bgSpeed = 3;
  const playerSpeed = 2;
  const balaSpeed = 4;
  const cuscuzSpeed = 2;

  let bgX = 0;

  const player = {
    x: 100,
    y: 150,
    width: 75,
    height: 75,
  };

  const bala = {
    x: player.x,
    y: player.y,
    width: 25,
    height: 25,
    active: false,
  };

  const cuscuz = {
    x: 500,
    y: 150,
    width: 25,
    height: 25,
  };

  const keys = {};
  window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

  function resetBala() {
    bala.x = player.x + player.width - 10;
    bala.y = player.y + player.height / 2 - bala.height / 2;
    bala.active = false;
  }

  function respawnCuscuz() {
    cuscuz.x = WIDTH + 30;
    cuscuz.y = Math.floor(Math.random() * (HEIGHT - cuscuz.height));
  }

  function rectsCollide(r1, r2) {
    return (
      r1.x < r2.x + r2.width &&
      r1.x + r1.width > r2.x &&
      r1.y < r2.y + r2.height &&
      r1.y + r1.height > r2.y
    );
  }

  function update() {
    if (gameOver) return;

    if (keys['arrowup'] && player.y > 0) {
      player.y -= playerSpeed;
      if (!bala.active) bala.y -= playerSpeed / 2;
    }
    if (keys['arrowdown'] && player.y < HEIGHT - player.height) {
      player.y += playerSpeed;
      if (!bala.active) bala.y += playerSpeed / 2;
    }

    if (keys[' '] && !bala.active) {
      bala.active = true;
      bala.x = player.x + player.width - 10;
      bala.y = player.y + player.height / 2 - bala.height / 2;
    }

    if (bala.active) {
      bala.x += balaSpeed;
      if (bala.x > WIDTH + 25) resetBala();
    } else {
      bala.x = player.x;
      bala.y = player.y + player.height / 2 - bala.height / 2;
    }

    cuscuz.x -= cuscuzSpeed;
    if (cuscuz.x < -cuscuz.width) {
      gameOver = true;
      showGameOver();
    }

    if (rectsCollide(player, cuscuz)) {
      gameOver = true;
      showGameOver();
      return;
    }

    if (bala.active && rectsCollide(bala, cuscuz)) {
      pontos++;
      respawnCuscuz();
      resetBala();
    }

    scoreDiv.textContent = `Pontos: ${pontos}`;
  }

  function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    bgX -= bgSpeed;
    if (bgX <= -WIDTH) bgX = 0;
    ctx.drawImage(bgImg, bgX, 0, WIDTH, HEIGHT);
    ctx.drawImage(bgImg, bgX + WIDTH, 0, WIDTH, HEIGHT);

    ctx.drawImage(cuscuzImg, cuscuz.x, cuscuz.y, cuscuz.width, cuscuz.height);
    ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
    if (bala.active) {
      ctx.drawImage(balaImg, bala.x, bala.y, bala.width, bala.height);
    }
  }

  function showGameOver() {
    gameOverScreen.style.display = 'flex';
    setTimeout(() => {
      window.location.reload();
    }, 3000);
  }

  function gameLoop() {
    update();
    draw();
    if (!gameOver) requestAnimationFrame(gameLoop);
  }

  let loadedCount = 0;
  [bgImg, playerImg, balaImg, cuscuzImg].forEach(img => {
    img.onload = () => {
      loadedCount++;
      if (loadedCount === 4) gameLoop();
    };
  });
</script>

</body>
</html>
